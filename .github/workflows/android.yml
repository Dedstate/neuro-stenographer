name: Offline Android APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-${{ hashFiles('scripts/models.lock.json') }}
      - run: python3 scripts/prepare_models.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
        working-directory: android
      - run: python3 scripts/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-stenographer-offline-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
